name: Deploy LMS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          timeout: 180s
          command_timeout: 180s
          script: |
            cd /root/LEADSYSTEM
            git pull origin main
            cd server && npm install
            cd ..
            pm2 reload ecosystem.config.js
            pm2 save
            cd client && npm install
            npm run build
            mkdir -p /home/ubuntu/lms-build
            rm -rf /home/ubuntu/lms-build/*
            if [ -d "dist" ]; then cp -r dist/* /home/ubuntu/lms-build/; elif [ -d "build" ]; then cp -r build/* /home/ubuntu/lms-build/; fi
            chown -R www-data:www-data /home/ubuntu/lms-build
            chmod -R 755 /home/ubuntu/lms-build
            nginx -t && systemctl reload nginx
            echo "Deployed successfully!"
