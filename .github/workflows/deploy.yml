name: Deploy LMS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          timeout: 300s
          command_timeout: 300s
          script: |
            cd /root/Olivialms
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/Reddington-Global-Consultancy-Pvt-Ltd/Olivialms.git
            git reset --hard HEAD
            git pull origin main
            bash /root/Olivialms/deploy.sh
